name: LongProbe CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev
      - run: uv run ruff check src/

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --dev --python "${{ matrix.python-version }}"
      - run: uv run pytest tests/unit/ tests/integration/test_reliability_workflow.py -v --tb=short --run-integration

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --all-extras
      - run: uv run pytest tests/ -v --run-integration

  build-check:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv build
      - name: Verify wheel in a base-only environment outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/longprobe-wheel" --python 3.12
          uv pip install --python "$RUNNER_TEMP/longprobe-wheel/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/longprobe-wheel/bin/python" -c 'import importlib.metadata as m, longprobe; assert m.version("longprobe") == longprobe.__version__'
          "$RUNNER_TEMP/longprobe-wheel/bin/longprobe" --help
